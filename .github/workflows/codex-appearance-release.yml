name: Verify Teyvat appearance release
on:
  push:
    branches: [codex-appearance-stage-20261111]
    paths: ['.codex-release-appearance/manifest.json']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and build clean release branch
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD^)
          test "$base" = 20154be4c41e8cc1860dd76a96d2f9bfc6fe5667
          python .codex-release-appearance/rebuild.py
          git rm --cached -r -- .codex-release-appearance .github/workflows/codex-appearance-release.yml
          git add -- .nojekyll README.md release-manifest.json *.js *.html *.css *.txt teyvat-offline.zip vendor/ocr
          git -c core.whitespace=cr-at-eol diff --cached --check
          tree=$(git write-tree)
          commit=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$base" -m 'Publish site-wide color styles and separate teammate cards')
          git push origin "$commit:refs/heads/codex-appearance-20261111"
          printf 'Verified release commit: %s\n' "$commit"
