name: Verify UI release offline bundle
on:
  push:
    branches: [codex-ui-cleanup-20261023]
    paths: ['.offline-update-ui-20261023.json']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify the exact offline release delta
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,pathlib
          root=pathlib.Path.cwd()
          recipe=root/'.offline-update-ui-20261023.json'
          spec=json.loads(recipe.read_text())
          base=(root/'teyvat-offline.zip').read_bytes()
          assert hashlib.sha256(base).hexdigest()==spec['baseSha256']
          chunks=[]
          for operation in spec['operations']:
              if 'copy' in operation:
                  offset,length=operation['copy']
                  assert offset>=0 and length>=0 and offset+length<=len(base)
                  chunks.append(base[offset:offset+length])
              else:
                  chunks.append(base64.b64decode(operation['data'],validate=True))
          output=b''.join(chunks)
          assert len(output)==spec['targetBytes']
          assert hashlib.sha256(output).hexdigest()==spec['targetSha256']
          (root/'teyvat-offline.zip').write_bytes(output)
          for item in json.loads((root/'release-manifest.json').read_text())['files']:
              assert hashlib.sha256((root/item['path']).read_bytes()).hexdigest()==item['sha256'],item['path']
          recipe.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- teyvat-offline.zip .offline-update-ui-20261023.json
          git commit -m 'Verify offline bundle for UI cleanup and back to top'
          git push origin HEAD:codex-ui-cleanup-20261023
