name: Verify Nilou choice offline update
on:
  push:
    branches: [codex-nilou-golden-choice-20261023]
    paths: ['.offline-update-nilou-20261023.json']
permissions:
  contents: write
jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify release files
        run: |
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          patch = json.loads(Path('.offline-update-nilou-20261023.json').read_text())
          target = Path('teyvat-offline.zip')
          old = target.read_bytes()
          assert hashlib.sha256(old).hexdigest() == patch['baseSha256']
          data = b''.join(old[x['copy'][0]:sum(x['copy'])] if 'copy' in x else base64.b64decode(x['data']) for x in patch['operations'])
          assert len(data) == patch['targetBytes']
          assert hashlib.sha256(data).hexdigest() == patch['targetSha256']
          target.write_bytes(data)
          manifest = json.loads(Path('release-manifest.json').read_text())
          for entry in manifest['files']:
              content = Path(entry['path']).read_bytes()
              assert len(content) == entry['bytes'], entry['path']
              assert hashlib.sha256(content).hexdigest() == entry['sha256'], entry['path']
          Path('.offline-update-nilou-20261023.json').unlink()
          print('All release files verified:', len(manifest['files']))
          PY
      - name: Save verified offline bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- teyvat-offline.zip .offline-update-nilou-20261023.json
          git commit -m "Assemble verified Nilou choice offline bundle"
          git push origin HEAD:codex-nilou-golden-choice-20261023
