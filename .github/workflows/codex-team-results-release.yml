name: Verify Teyvat team results layout release
on:
  push:
    branches: [codex-team-results-stage-20261125]
    paths: ['.codex-release-team-results/manifest.json']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and build clean release branch
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD^)
          test "$base" = 9c94bffe084a03b746f49a62d1eb2614127ee5d9
          python .codex-release-team-results/rebuild.py
          git rm --cached -r -- .codex-release-team-results .github/workflows/codex-team-results-release.yml
          git add -- .nojekyll README.md release-manifest.json *.js *.html *.css *.txt teyvat-offline.zip vendor/ocr
          git -c core.whitespace=cr-at-eol diff --cached --check
          tree=$(git write-tree)
          commit=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$base" -m 'Show team results and collapse damage conditions by default')
          git push origin "$commit:refs/heads/codex-team-results-20261125"
          printf 'Verified release commit: %s\n' "$commit"
