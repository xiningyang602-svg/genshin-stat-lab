name: Verify Teyvat desktop width release
on:
  push:
    branches: [codex-desktop-width-stage-20261125]
    paths: ['.codex-release-desktop-width/**', '.github/workflows/codex-desktop-width-release.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify and build clean release branch
        shell: bash
        run: |
          set -euo pipefail
          base=cbd576beefa5059b3803b0c37786e2557a5e4a5a
          git merge-base --is-ancestor "$base" HEAD
          python .codex-release-desktop-width/rebuild.py
          git rm --cached -r -- .codex-release-desktop-width .github/workflows/codex-desktop-width-release.yml
          git add -- .nojekyll README.md release-manifest.json *.js *.html *.css *.txt teyvat-offline.zip vendor/ocr
          git -c core.whitespace=cr-at-eol diff --cached --check
          tree=$(git write-tree)
          commit=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$base" -m 'Restore team cards and narrow wide layouts')
          git push origin "$commit:refs/heads/codex-desktop-width-20261125"
          printf 'Verified release commit: %s\n' "$commit"
