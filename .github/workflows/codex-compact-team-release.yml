name: Verify compact Teyvat team results release
on:
  push:
    branches: [codex-compact-team-stage-20261125]
    paths: ['.codex-release-compact-team/**', '.github/workflows/codex-compact-team-release.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify and build clean release branch
        shell: bash
        run: |
          set -euo pipefail
          base=b7b5f9f424c259c2584f6374c50f4a39b9c13793
          git merge-base --is-ancestor "$base" HEAD
          python .codex-release-compact-team/rebuild.py
          git rm --cached -r -- .codex-release-compact-team .github/workflows/codex-compact-team-release.yml
          git add -- .nojekyll README.md release-manifest.json *.js *.html *.css *.txt teyvat-offline.zip vendor/ocr
          git -c core.whitespace=cr-at-eol diff --cached --check
          tree=$(git write-tree)
          commit=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$base" -m 'Compact the team result layout')
          git push origin "$commit:refs/heads/codex-compact-team-20261125"
          printf 'Verified release commit: %s\n' "$commit"
