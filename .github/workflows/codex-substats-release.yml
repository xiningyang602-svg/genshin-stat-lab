name: Verify Teyvat substat score release
on:
  push:
    branches: [codex-substats-stage-20261125]
    paths: ['.codex-release-substats/manifest.json']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and build clean release branch
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD^)
          test "$base" = f79547ea8033ed70df3db24ed76418d723b00ac3
          python .codex-release-substats/rebuild.py
          git rm --cached -r -- .codex-release-substats .github/workflows/codex-substats-release.yml
          git add -- .nojekyll README.md release-manifest.json *.js *.html *.css *.txt teyvat-offline.zip vendor/ocr
          git -c core.whitespace=cr-at-eol diff --cached --check
          tree=$(git write-tree)
          commit=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$base" -m 'Add effective substat counts and equal-budget comparison')
          git push origin "$commit:refs/heads/codex-substats-20261125"
          printf 'Verified release commit: %s\n' "$commit"
